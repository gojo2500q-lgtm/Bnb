name: Build Patcher APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/lemonloader/patcher
          echo "include ':app'" > settings.gradle
          printf "plugins { id 'com.android.application' }\nandroid { compileSdk 33\n defaultConfig { applicationId \"com.lemonloader.patcher\"; minSdk 26; targetSdk 33 } }" > app/build.gradle
          printf "package com.lemonloader.patcher;\nimport android.app.Activity;\npublic class MainActivity extends Activity {}" > app/src/main/java/com/lemonloader/patcher/MainActivity.java
          mkdir -p app/src/main
          echo '<manifest/>' > app/src/main/AndroidManifest.xml
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Patcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
